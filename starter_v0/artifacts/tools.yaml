# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: ask_user
    description: "Ask the user for required missing information or explicit confirmation. For send/post/publish actions without prior confirmation, use response_type=yes_no."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: get_user_tweets
    description: "Retrieve recent public tweets from a specific X (formerly Twitter) user. Use this tool when the user wants to see or summarize tweets posted by a particular account. Supports limiting the number of tweets returned and includes tweet content, publication date, engagement metrics, and direct links."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: search_tweets
    description: "Search public tweets on X (formerly Twitter) using a keyword or phrase. Use this tool when the user wants to know what people are saying about a topic, company, event, or person. Supports Latest and Top search modes and returns matching tweets with metadata and links."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: web_search
    description: "Search the web for up-to-date information on a topic or query. Use this tool when the user requests recent news, current events, factual information, or web content that requires online search. Supports topic filtering (e.g., news or general) and optional time ranges such as day, week, or month."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: read_url
    description: "Read and extract the content of a specific web page from its URL. Use this tool when the user provides a link and wants to summarize, analyze, or answer questions about that page. Returns the page title, source, URL, and extracted markdown content"
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: render_digest
    description: "Format a collection of news articles or social posts into a structured markdown digest. Use this tool after gathering information to generate a readable summary in formats such as sections, bullets, brief, thread, or daily newsletter."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send_telegram
    description: "Send text to Telegram only after explicit user confirmation. Never call this tool to request confirmation; use clarify(response_type=yes_no) first."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: search_company_policy
    description: "Search the company's internal policy documents by keyword or policy area. Use this tool when the user asks about company rules, procedures, benefits, compliance requirements, or other internal policies. Returns the most relevant policy sections along with their source, effective date, and supporting facts while filtering out instruction-like or untrusted content."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: arxiv_search
    description: "Search the arXiv repository for research papers by keyword or topic. Use this tool when the user wants to find academic papers related to a research area, method, or concept. Supports limiting the number of results and sorting by relevance, submission date, or last updated date. Returns paper metadata, abstracts, authors, categories, and links to the paper and PDF."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: get_arxiv_paper_text
    description: "Download and extract text from an arXiv paper. Use this tool when the user provides an arXiv URL or ID and wants to summarize, analyze, review, or answer questions about the paper. The tool downloads the PDF, extracts text from the specified number of pages, and returns an excerpt with metadata."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
